<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#222;--mu:#666;--ac:#e8642c;--bd:#ddd;--ok:#1a7f45;--okb:#e3f5ea;--no:#c62828;--nob:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--card:#262524;--tx:#eee;--mu:#aaa;--bd:#444;--ok:#6fd49a;--okb:#16301f;--no:#ff8a80;--nob:#3a1d1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a19;--card:#262524;--tx:#eee;--mu:#aaa;--bd:#444;--ok:#6fd49a;--okb:#16301f;--no:#ff8a80;--nob:#3a1d1d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1{font-size:18px;margin:0}h1 small{color:var(--mu);font-weight:400;font-size:13px;display:block}
.tg{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;user-select:none}
.tg input{width:40px;height:22px;appearance:none;background:var(--bd);border-radius:11px;position:relative;cursor:pointer;transition:.2s}
.tg input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked{background:var(--ac)}.tg input:checked::after{left:20px}
main{max-width:820px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:18px}
h2{font-size:19px;margin:0 0 2px;color:var(--ac)}.en{color:var(--mu);font-size:14px;margin:0 0 12px}
.q{display:flex;gap:10px;align-items:center;padding:10px 8px;border-radius:8px;margin-top:6px;flex-wrap:wrap}
.q .n{font-weight:700;min-width:28px}.q .s{flex:1;min-width:200px}
.q.ok{background:var(--okb)}.q.bad{background:var(--nob)}
ruby{ruby-align:center;margin:0 1px}rt{font-size:.55em;color:var(--mu);font-family:system-ui,sans-serif}
body.hp rt{display:none}
.ex{color:var(--mu);border-bottom:1px dashed var(--bd);padding-bottom:10px;margin-bottom:6px}
select{font:inherit;font-size:16px;padding:3px 6px;border:1.5px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);min-width:64px}
select.blank{margin:0 4px}
.imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:10px}
.imgs figure{margin:0;text-align:center}.imgs img{max-width:100%;max-height:150px;border-radius:6px;border:1px solid var(--bd)}
.imgs b{display:block}
.bank{display:flex;flex-wrap:wrap;gap:8px 18px;background:var(--bg);padding:8px 12px;border-radius:8px;margin-bottom:6px}
ul.opt{list-style:none;padding:0;margin:0 0 6px}ul.opt li{padding:4px 0}ul.opt b{margin-right:8px}
.fb{font-size:14px;width:100%;padding-left:38px;display:none;color:var(--mu)}
.q.ok .fb,.q.bad .fb{display:block}.q.ok .fb{color:var(--ok)}.q.bad .fb{color:var(--no)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:16px;border:0;border-radius:8px;padding:10px 22px;cursor:pointer;background:var(--ac);color:#fff}
button.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
#score{font-weight:700;font-size:20px}
</style></head><body class="hp">
